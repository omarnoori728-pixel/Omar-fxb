<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OMAR FXB</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.page{
  display:none;
  width:90%;
  max-width:430px;
  animation:fade .6s ease;
}

.active{display:block}

.logo{
  color:#e50914;
  font-size:40px;
  font-weight:bold;
  letter-spacing:5px;
  margin-bottom:25px;
  text-shadow:0 0 20px rgba(229,9,20,.4);
}

.title{
  font-size:26px;
  font-weight:bold;
  margin-bottom:35px;
}

button{
  background:#e50914;
  color:white;
  border:0;
  padding:15px 40px;
  border-radius:30px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 0 25px rgba(229,9,20,.4);
}

input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:1px solid #333;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:16px;
  outline:none;
}

.signup-title{
  font-size:28px;
  font-weight:bold;
  margin-bottom:20px;
}

.error{
  color:#e50914;
  margin-top:15px;
}

.question{
  font-size:28px;
  font-weight:bold;
  margin-bottom:35px;
}

.answers{
  position:relative;
  height:100px;
}

.yes{
  background:#e50914;
  margin-right:10px;
}

.no{
  background:#222;
  position:absolute;
  margin-left:10px;
}

.heart{
  font-size:120px;
  animation:heart 1s infinite alternate;
}

.love{
  color:#e50914;
  font-size:30px;
  font-weight:bold;
  margin:15px 0 30px;
}

.message{
  font-size:23px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:30px;
}

.celebrate{
  font-size:55px;
  margin-bottom:15px;
}

.thanks{
  color:#aaa;
  margin-top:15px;
  font-size:16px;
}

@keyframes fade{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

@keyframes heart{
  from{transform:scale(1)}
  to{transform:scale(1.12)}
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active">
  <div class="logo">OMAR FXB</div>
  <div class="title">WELCOME TO FXB</div>
  <button onclick="showPage('signup')">OPEN</button>
</div>


<!-- SIGN UP -->
<div id="signup" class="page">

  <div class="signup-title">SIGN UP</div>

  <input id="firstName" type="text" placeholder="First Name">
  <input id="lastName" type="text" placeholder="Last Name">
  <input id="country" type="text" placeholder="Country">
  <input id="code" type="password" placeholder="Enter Code">

  <button onclick="register()">CONTINUE</button>

  <div id="error" class="error"></div>
</div>


<!-- FIRST QUESTION -->
<div id="lovePage" class="page">

  <div class="question">
    Do you love me? ❤️
  </div>

  <div class="answers">

    <button class="yes" onclick="showPage('loveFinal')">
      YES ❤️
    </button>

    <button id="noButton" class="no" onclick="moveNo()">
      NO 😏
    </button>

  </div>

</div>


<!-- I LOVE YOU -->
<div id="loveFinal" class="page">

  <div class="heart">❤️</div>

  <div class="love">
    I LOVE YOU TOOOOO ❤️
  </div>

  <button onclick="showPage('sorryPage')">
    NEXT
  </button>

</div>


<!-- SORRY -->
<div id="sorryPage" class="page">

  <div class="message">
    I'm sorry for making you upset. 🥺❤️
    <br><br>
    Can we be best friends again?
  </div>

  <div class="answers">

    <button class="yes" onclick="showPage('celebratePage')">
      YES ❤️
    </button>

    <button id="noButton2" class="no" onclick="moveNo2()">
      NO 😏
    </button>

  </div>

</div>


<!-- CELEBRATION -->
<div id="celebratePage" class="page">

  <div class="celebrate">
    🎉🥹❤️🎉
  </div>

  <div class="logo">
    OMAR FXB
  </div>

  <div class="love">
    BEST FRIENDS AGAIN! ❤️
  </div>

  <div class="thanks">
    Thank you for giving me another chance. 🥹❤️
    <br><br>
    OMAR FXB × FOREVER
  </div>

</div>


<script>

function showPage(page){

  document.querySelectorAll('.page')
    .forEach(p => p.classList.remove('active'));

  document.getElementById(page)
    .classList.add('active');
}


function register(){

  let first=document.getElementById('firstName').value;
  let last=document.getElementById('lastName').value;
  let country=document.getElementById('country').value;
  let code=document.getElementById('code').value;

  if(!first || !last || !country || !code){

    document.getElementById('error').innerText =
      "Please complete all fields.";

    return;
  }

  if(code !== "846"){

    document.getElementById('error').innerText =
      "Incorrect code.";

    return;
  }

  showPage('lovePage');
}


function moveNo(){

  const button=document.getElementById('noButton');

  button.style.position="fixed";

  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-60);

  button.style.left=x+"px";
  button.style.top=y+"px";
}


function moveNo2(){

  const button=document.getElementById('noButton2');

  button.style.position="fixed";

  const x=Math.random()*(window.innerWidth-100);
  const y=Math.random()*(window.innerHeight-60);

  button.style.left=x+"px";
  button.style.top=y+"px";
}

</script>

</body>
</html>
